<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblioteca — Catálogo</title>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2C4137">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
</head>
<body>
<div class="app-shell">

  <nav class="sidebar">
    <div class="sidebar__brand">Biblioteca <span>v1.0</span></div>
    <ul class="sidebar__nav">
      <li><a href="index.html">Painel</a></li>
      <li><a href="catalogo.html">Catálogo</a></li>
      <li><a href="emprestimos.html">Empréstimos</a></li>
      <li><a href="utilizadores.html">Utilizadores</a></li>
      <li><a href="relatorios.html">Relatórios</a></li>
    </ul>
  </nav>

  <main class="main">
    <div class="page-header">
      <div>
        <h1>Catálogo</h1>
        <p>Pesquisa, adiciona e gere os livros da biblioteca.</p>
      </div>
      <button class="btn" id="btn-mostrar-form">+ Novo livro</button>
    </div>

    <div id="mensagem"></div>

    <div class="card" id="form-livro-card" style="display:none;">
      <h2 id="form-titulo">Adicionar livro</h2>
      <form id="form-livro">
        <input type="hidden" id="livro-id">
        <div class="form-row">
          <div class="field">
            <label for="livro-titulo">Título *</label>
            <input type="text" id="livro-titulo" required>
          </div>
          <div class="field">
            <label for="livro-autor">Autor *</label>
            <input type="text" id="livro-autor" required>
          </div>
        </div>
        <div class="form-row">
          <div class="field">
            <label for="livro-categoria">Categoria</label>
            <input type="text" id="livro-categoria" placeholder="Ex: Ficção, Poesia, Técnico...">
          </div>
          <div class="field">
            <label for="livro-isbn">ISBN</label>
            <input type="text" id="livro-isbn">
          </div>
        </div>
        <div class="form-row">
          <div class="field">
            <label for="livro-exemplares">Nº de exemplares *</label>
            <input type="number" id="livro-exemplares" min="1" value="1" required>
          </div>
          <div class="field">
            <label for="livro-localizacao">Localização (prateleira)</label>
            <input type="text" id="livro-localizacao" placeholder="Ex: A1-01">
          </div>
        </div>
        <div class="toolbar">
          <button type="submit" class="btn">Guardar</button>
          <button type="button" class="btn secundario" id="btn-cancelar-form">Cancelar</button>
        </div>
      </form>
    </div>

    <div class="toolbar">
      <div class="field" style="max-width:320px;">
        <input type="text" id="pesquisa" placeholder="Pesquisar por título, autor ou ISBN…">
      </div>
      <button class="btn secundario pequeno" id="btn-pesquisar">Pesquisar</button>
      <button class="btn secundario pequeno" id="btn-limpar">Limpar</button>
    </div>

    <div id="lista-livros">
      <p class="loading">A carregar catálogo…</p>
    </div>

  </main>
</div>

<script src="js/api.js"></script>
<script src="js/pwa.js"></script>
<script src="js/catalogo.js"></script>
</body>
</html>
