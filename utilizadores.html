<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblioteca — Utilizadores</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">

  <nav class="sidebar">
    <div class="sidebar__brand">Biblioteca <span>v1.0</span></div>
    <ul class="sidebar__nav">
      <li><a href="index.html">Painel</a></li>
      <li><a href="catalogo.html">Catálogo</a></li>
      <li><a href="emprestimos.html">Empréstimos</a></li>
      <li><a href="utilizadores.html">Utilizadores</a></li>
      <li><a href="relatorios.html">Relatórios</a></li>
    </ul>
  </nav>

  <main class="main">
    <div class="page-header">
      <div>
        <h1>Utilizadores</h1>
        <p>Leitores registados na biblioteca.</p>
      </div>
      <button class="btn" id="btn-mostrar-form">+ Novo utilizador</button>
    </div>

    <div id="mensagem"></div>

    <div class="card" id="form-utilizador-card" style="display:none;">
      <h2>Adicionar utilizador</h2>
      <form id="form-utilizador">
        <div class="form-row">
          <div class="field">
            <label for="user-nome">Nome *</label>
            <input type="text" id="user-nome" required>
          </div>
          <div class="field">
            <label for="user-email">Email *</label>
            <input type="email" id="user-email" required>
          </div>
          <div class="field">
            <label for="user-tipo">Tipo</label>
            <select id="user-tipo">
              <option value="aluno">Aluno</option>
              <option value="professor">Professor</option>
              <option value="staff">Staff</option>
            </select>
          </div>
        </div>
        <div class="toolbar">
          <button type="submit" class="btn">Guardar</button>
          <button type="button" class="btn secundario" id="btn-cancelar-form">Cancelar</button>
        </div>
      </form>
    </div>

    <div id="lista-utilizadores">
      <p class="loading">A carregar…</p>
    </div>

  </main>
</div>

<script src="js/api.js"></script>
<script src="js/utilizadores.js"></script>
</body>
</html>
